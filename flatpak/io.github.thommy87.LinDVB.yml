app-id: io.github.thommy87.LinDVB
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: lindvb
rename-icon: lindvb
finish-args:
  - --share=ipc
  - --share=network            # internet TV, XMLTV, multicast IPTV
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all               # /dev/dvb tuners and GPU
  - --filesystem=xdg-videos    # recordings (~/Videos/LinDVB)
  - --filesystem=xdg-pictures  # screenshots
  - --system-talk-name=org.freedesktop.login1   # standby/power off after recording
  # The runtime's codecs-extra extension (installed with it) brings the full
  # FFmpeg for MPEG-2, H.264, HEVC, AC-3 and AAC broadcast decoding.
  - --env=GST_PLUGIN_SYSTEM_PATH=/app/lib/gstreamer-1.0:/usr/lib/extensions/gstreamer-1.0:/usr/lib/x86_64-linux-gnu/codecs-extra/lib/gstreamer-1.0:/usr/lib/aarch64-linux-gnu/codecs-extra/lib/gstreamer-1.0:/usr/lib/x86_64-linux-gnu/gstreamer-1.0:/usr/lib/aarch64-linux-gnu/gstreamer-1.0

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - /share/doc
  - '*.la'
  - '*.a'

modules:
  # libzvbi for the teletext decoder
  - name: zvbi
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --without-x
      - --disable-v4l
      - --disable-nls
    cleanup:
      - /bin
      - /sbin
    sources:
      - type: git
        url: https://github.com/zapping-vbi/zvbi.git
        tag: v0.2.44
        commit: 5169a428d51c3ae8ff7b0897e8a687d8e05e37b5

  # Only the teletext and DVB plugins from gst-plugins-bad; the GNOME runtime
  # does not ship teletextdec, and building dvbsrc here guarantees tuner access.
  - name: gst-plugins-bad-dvb-teletext
    buildsystem: meson
    subdir: subprojects/gst-plugins-bad
    config-opts:
      - -Dauto_features=disabled
      - -Dteletext=enabled
      - -Ddvb=enabled
      - -Dexamples=disabled
      - -Dtests=disabled
      - -Ddoc=disabled
      - -Dintrospection=disabled
      - -Dnls=disabled
      - -Dorc=disabled
    post-install:
      # keep the two plugins; use the runtime's GStreamer libraries
      - find ${FLATPAK_DEST}/lib/gstreamer-1.0 -name '*.so' ! -name libgstteletext.so ! -name libgstdvb.so -delete
      - rm -f ${FLATPAK_DEST}/lib/libgst*
    sources:
      - type: git
        url: https://github.com/GStreamer/gstreamer.git
        tag: 1.24.12
        commit: 88e31216479a3f0c25096ca406369f3983efec14

  # dvbv5-scan / dvbv5-zap (libdvbv5)
  - name: v4l-utils
    buildsystem: meson
    config-opts:
      - -Dqv4l2=disabled
      - -Dqvidcap=disabled
      - -Dbpf=disabled
      - -Djpeg=disabled
      - -Dgconv=disabled
      - -Dv4l2-tracer=disabled
      - -Dlibdvbv5=enabled
      - -Dv4l-plugins=false
      - -Ddoxygen-doc=disabled
      - -Dudevdir=/app/lib/udev
      - -Dsystemdsystemunitdir=/app/lib/systemd/system
    cleanup:
      - /lib/udev
      - /lib/systemd
      - /etc
    post-install:
      # keep only the DVB tools
      - find ${FLATPAK_DEST}/bin -type f ! -name 'dvb*' -delete
    sources:
      - type: git
        url: https://github.com/gjasny/v4l-utils.git
        tag: v4l-utils-1.28.1
        commit: fc15e229d9d337e46d730f00647821adbbd58548

  # projectM visualisations for radio (as in the AppImage, packaging/build-projectm.sh):
  # libprojectM 4.1, the gst-projectm plugin and a preset and texture collection
  - name: libprojectM
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DENABLE_PLAYLIST=ON
      - -DBUILD_TESTING=OFF
      - -DENABLE_SDL_UI=OFF
    cleanup:
      - /lib/cmake
    sources:
      - type: git
        url: https://github.com/projectM-visualizer/projectm.git
        tag: v4.1.8
        commit: 4967dc003e5206d7df3ff447287f7609c47d2343

  - name: gst-projectm
    buildsystem: simple
    build-commands:
      # projectm_set_frame_time() only exists in libprojectM 4.2; 4.1 times frames itself
      - sed -i '/projectm_set_frame_time(/d' src/plugin.c
      - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=${FLATPAK_DEST}
        -DCMAKE_C_FLAGS="-include stdbool.h"
      - cmake --build build
      - install -Dm755 $(find build -name libgstprojectm.so) -t ${FLATPAK_DEST}/lib/gstreamer-1.0
      - install -Dm644 LICENSE ${FLATPAK_DEST}/share/projectM/LICENSE.gst-projectm
    sources:
      - type: git
        url: https://github.com/projectM-visualizer/gst-projectm.git
        commit: 54c481c0b063065406cfeedffe0aecfa13a43f0e

  - name: projectm-presets
    buildsystem: simple
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/share/projectM/presets ${FLATPAK_DEST}/share/projectM/textures
      - tar -C presets --exclude=.git -cf - . | tar -C ${FLATPAK_DEST}/share/projectM/presets -xf -
      - find textures -type f \( -iname '*.jpg' -o -iname '*.png' -o -iname '*.tga' -o -iname '*.bmp'
        -o -iname '*.dds' \) -exec cp {} ${FLATPAK_DEST}/share/projectM/textures/ \;
    sources:
      - type: git
        url: https://github.com/projectM-visualizer/presets-cream-of-the-crop.git
        commit: 0180df21f5e0bd39b9060cc5de420ed2f1f9e509
        dest: presets
      - type: git
        url: https://github.com/projectM-visualizer/presets-milkdrop-texture-pack.git
        commit: 6368812f27bc747b517218fbf89d21d59afce4d9
        dest: textures

  - name: lindvb
    buildsystem: simple
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/share/lindvb
      - cp -r lindvb ${FLATPAK_DEST}/share/lindvb/
      - install -Dm755 flatpak/lindvb.sh ${FLATPAK_DEST}/bin/lindvb
      - install -Dm644 data/io.github.thommy87.LinDVB.desktop -t ${FLATPAK_DEST}/share/applications
      - install -Dm644 data/io.github.thommy87.LinDVB.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - install -Dm644 data/lindvb.svg -t ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps
      - cp -r data/icons/hicolor/. ${FLATPAK_DEST}/share/icons/hicolor/
    sources:
      - type: dir
        path: ..
        skip:
          - build
          - .git
          - .flatpak-builder
