name: lindvb
title: LinDVB
summary: "Digital TV and radio: watch and record"
description: |
  LinDVB is a digital TV and radio app. It plays and records satellite, cable,
  terrestrial and internet TV and radio using the Linux DVB API and GStreamer.
  It has timeshift, timer and series recordings, a programme guide, teletext,
  HbbTV, several tuners at once including Unicable/JESS, channel search and a
  channel editor.

  To use a DVB tuner, connect the dvb interface:
    sudo snap connect lindvb:dvb
license: GPL-2.0-or-later
icon: data/lindvb.svg
adopt-info: lindvb
base: core24
grade: stable
confinement: strict
platforms:
  amd64:
  arm64:

apps:
  lindvb:
    command: bin/lindvb
    extensions: [gnome]
    common-id: io.github.thommy87.LinDVB
    desktop: usr/share/applications/io.github.thommy87.LinDVB.desktop
    plugs:
      - dvb              # /dev/dvb tuners
      - network          # internet TV, XMLTV
      - network-bind     # HbbTV: app to app (127.0.0.1), DIAL and sync for companion screens
      - audio-playback
      - home             # recordings in ~/Videos
      - removable-media  # recordings on external drives
    # No "shutdown" plug: it is a super-privileged interface, so every revision
    # that asks for it goes into the Snap Store's manual review and cannot be
    # released. Standby or power-off after a recording therefore does nothing in
    # the snap (recorder.power_action logs the refused D-Bus call); the Flatpak
    # and the AppImage still do it. See docs/STORES.md.
    environment:
      # HbbTV: WebKitGTK 6 is staged below (the GNOME content snap only has
      # webkit2gtk-4.1 for GTK 3). Its bubblewrap sandbox cannot run inside the
      # snap's confinement, which already isolates it, so it is switched off
      # like in other WebKit snaps.
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
      PYTHONPATH: $SNAP/lib/lindvb:$SNAP/usr/lib/python3/dist-packages
      GI_TYPELIB_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/girepository-1.0:${GI_TYPELIB_PATH}
      GST_PLUGIN_SYSTEM_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gstreamer-1.0:$SNAP/gnome-platform/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gstreamer-1.0
      GST_PLUGIN_SCANNER: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gstreamer1.0/gstreamer-1.0/gst-plugin-scanner
      # blas/ and lapack/: libsphinxbase (libavfilter -> libpocketsphinx) needs
      # libblas.so.3 and liblapack.so.3. Their packages put them only into these
      # subdirectories; the usual links in lib/<triplet> come from
      # update-alternatives, which stage-packages never run. Without them the
      # gst-libav plugin does not load and avdec_h264 and the other decoders are
      # missing.
      # TLS for souphttpsrc (every https:// IPTV stream) and libsoup: the GNOME
      # content snap ships libsoup but not glib-networking, and the gnome
      # extension's desktop-launch points GIO_MODULE_DIR at a cache of the
      # content snap's GIO modules only. Without a TLS backend every HTTPS
      # stream fails at once ("Internal data stream error", flow error -5).
      # GIO also loads the modules in GIO_EXTRA_MODULES, which desktop-launch
      # leaves alone: the staged glib-networking (GnuTLS, libproxy) lives here.
      GIO_EXTRA_MODULES: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gio/modules
      LD_LIBRARY_PATH: ${LD_LIBRARY_PATH}:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/blas:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/lapack

# WebKit starts its web and network processes from the directory it was built
# for (/usr/lib/<triplet>/webkitgtk-6.0, also home of the injected bundle);
# it has no run-time setting for that, so the snap's copy is bound there.
layout:
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/webkitgtk-6.0:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/webkitgtk-6.0

parts:
  lindvb:
    plugin: nil
    source: .
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/lib/lindvb $CRAFT_PART_INSTALL/bin $CRAFT_PART_INSTALL/usr/share/applications \
               $CRAFT_PART_INSTALL/usr/share/metainfo
      cp -r lindvb $CRAFT_PART_INSTALL/lib/lindvb/
      find $CRAFT_PART_INSTALL/lib/lindvb -name __pycache__ -prune -exec rm -rf {} +
      install -m755 snap/local/lindvb.sh $CRAFT_PART_INSTALL/bin/lindvb
      sed 's|^Icon=.*|Icon=${SNAP}/meta/gui/icon.svg|' data/io.github.thommy87.LinDVB.desktop \
          > $CRAFT_PART_INSTALL/usr/share/applications/io.github.thommy87.LinDVB.desktop
      cp data/io.github.thommy87.LinDVB.metainfo.xml $CRAFT_PART_INSTALL/usr/share/metainfo/
      craftctl set version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
    stage-packages:
      - python3-gi
      - python3-gi-cairo
      - gir1.2-gstreamer-1.0
      - gir1.2-gst-plugins-base-1.0
      - gir1.2-gst-plugins-bad-1.0
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-libav
      - gstreamer1.0-pulseaudio
      - glib-networking   # GIO TLS backend for HTTPS streams, see GIO_EXTRA_MODULES
      - gir1.2-webkit-6.0 # HbbTV: WebKitGTK 6 with its JavaScriptCore, see the layout
      - dvb-tools
      - dtv-scan-tables

  # The GNOME content snap (gnome-46-2404, mounted at $SNAP/gnome-platform) ships
  # its own, much newer GTK stack: GLib 2.86, Pango 1.56, HarfBuzz 12, GTK 4.20.
  # The stage-packages above pull the Ubuntu 24.04 versions of many of the same
  # libraries in as dependencies (HarfBuzz 8.3, Pango 1.52, GLib 2.80, ...), and
  # those are found first at run time. GTK 4 from the content snap then loads
  # against the old HarfBuzz and fails ("libharfbuzz-subset.so.0: undefined
  # symbol: hb_free"), so "from gi.repository import Gtk" dies on start.
  # This part deletes every shared library from the snap that the content snap
  # also provides, so only the content snap's copy is used. Only the library
  # directories that are on the library path are cleaned (lib/<triplet>,
  # usr/lib/<triplet>) plus the GStreamer plugin directory, which is in
  # GST_PLUGIN_SYSTEM_PATH for both snaps. Libraries in other subdirectories,
  # such as pulseaudio/libpulsecommon, stay: the content snap's copies there are
  # not on any search path. Python modules stay too, so the staged PyGObject is
  # complete. The gnome extension does the same for core26 and later
  # ("gnome/cleanup"), but not for core24.
  cleanup:
    after: [lindvb]
    plugin: nil
    build-snaps: [gnome-46-2404]
    override-prime: |
      set -eu
      platform=/snap/gnome-46-2404/current
      arch="$CRAFT_ARCH_TRIPLET_BUILD_FOR"
      cd "$platform"
      for dir in "lib/$arch" "usr/lib/$arch" "usr/lib/$arch/gstreamer-1.0"; do
        [ -d "$dir" ] || continue
        find "$dir" -maxdepth 1 \( -type f -o -type l \) \( -name '*.so' -o -name '*.so.*' \)
      done |
      while IFS= read -r lib; do
        if [ -e "$CRAFT_PRIME/$lib" ] || [ -L "$CRAFT_PRIME/$lib" ]; then
          echo "cleanup: $lib is provided by gnome-46-2404"
          rm -f "$CRAFT_PRIME/$lib"
        fi
      done
