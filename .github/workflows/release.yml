name: Release

# Builds the AppImage, Flatpak, Snap, .deb and source package and publishes them together as a
# GitHub release. Start it from the Actions tab ("Run workflow").
#
# The packages go straight into a draft release rather than through workflow
# artifacts, so a full Actions storage quota can't block a release. The draft
# is published once all packages are attached.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
        run: |
          # Release notes: the changelog for this tag (if there is one), then the
          # install notes; GitHub appends the list of merged pull requests.
          : > notes.md
          if [ -f "packaging/changelog/${TAG}.md" ]; then
            cat "packaging/changelog/${TAG}.md" >> notes.md
          fi
          cat packaging/release-notes.md >> notes.md
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="LinDVB ${TAG}" \
            -F body=@notes.md -F draft=true -F generate_release_notes=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  appimage:
    needs: draft
    uses: ./.github/workflows/appimage.yml
    with:
      release_id: ${{ needs.draft.outputs.id }}
      release_tag: ${{ inputs.version }}
  flatpak:
    needs: draft
    uses: ./.github/workflows/flatpak.yml
    with:
      release_id: ${{ needs.draft.outputs.id }}
      release_tag: ${{ inputs.version }}
  snap:
    needs: draft
    uses: ./.github/workflows/snap.yml
    with:
      release_id: ${{ needs.draft.outputs.id }}
      release_tag: ${{ inputs.version }}

  packages:
    needs: draft
    uses: ./.github/workflows/packages.yml
    with:
      release_id: ${{ needs.draft.outputs.id }}
      release_tag: ${{ inputs.version }}

  publish:
    needs: [draft, appimage, flatpak, snap, packages]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.draft.outputs.id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -F make_latest=true --jq .html_url
