name: AUR package

# Builds the Arch package from packaging/aur/PKGBUILD against the release's
# source package and, when the AUR_SSH_PRIVATE_KEY secret is set, publishes it
# as "lindvb" on the AUR. Only for releases (called by the Release workflow
# once the release is published) and on demand.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released tag, e.g. v0.14.0"
        required: true
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
    secrets:
      AUR_SSH_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  aur:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    env:
      TAG: ${{ inputs.release_tag || inputs.version }}
      AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git openssh pacman-contrib

      - uses: actions/checkout@v4

      - name: Build and install the package
        # makepkg refuses to run as root
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          mkdir /build && cp packaging/aur/PKGBUILD /build/ && chown -R builder /build
          cd /build
          sudo -u builder sed -i "s/^pkgver=.*/pkgver=${TAG#v}/; s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sudo -u builder updpkgsums
          sudo -u builder makepkg --syncdeps --install --noconfirm
          sudo -u builder makepkg --printsrcinfo > .SRCINFO
          cd / && lindvb --help

      - name: Publish to the AUR
        if: env.AUR_KEY != ''
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$AUR_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/lindvb.git /aur
          cp /build/PKGBUILD /build/.SRCINFO /aur/
          cd /aur
          git config user.name "thommy87"
          git config user.email "thommy87@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then echo "AUR is up to date"; exit 0; fi
          git commit -m "Update to ${TAG#v}"
          git push origin HEAD:master

      - name: No AUR key
        if: env.AUR_KEY == ''
        run: echo "::notice title=AUR::The package built and installed; AUR_SSH_PRIVATE_KEY is not set, so it was not published."
