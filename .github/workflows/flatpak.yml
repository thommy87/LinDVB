name: Build Flatpak

# Only built for releases (the Release workflow, or a pushed v* tag) and on
# demand; normal pushes and pull requests build only the AppImage.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_id:
        description: "Draft release to upload the package to (set by the Release workflow)"
        type: string
        default: ""
      release_tag:
        type: string
        default: ""

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      # The image ships the GNOME SDK in a read-only image layer. Once Flathub
      # has a newer SDK than the image, flatpak-builder updates it, and that
      # fails with "Invalid cross-device link" (overlayfs cannot rename
      # directories of a lower layer). Copying the installations moves them
      # into the container's writable layer, where the update works.
      - name: Make the preinstalled runtimes updatable
        run: |
          for d in /var/lib/flatpak "$HOME/.local/share/flatpak"; do
            [ -d "$d" ] || continue
            echo "Copying $d ($(du -sh "$d" | cut -f1))"
            cp -a "$d" "$d.rw" && rm -rf "$d" && mv "$d.rw" "$d"
          done
          flatpak list --runtime --columns=application,branch,installation

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: LinDVB.flatpak
          manifest-path: flatpak/io.github.thommy87.LinDVB.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      # Only for the test job below (and the tag-push release job): about 2 MB,
      # kept for a day, as the Actions storage quota is small.
      - uses: actions/upload-artifact@v4
        with:
          name: lindvb-flatpak
          path: LinDVB.flatpak
          retention-days: 1

  # The bundle as a user gets it: installed next to the GNOME runtime from
  # Flathub (with its codecs-extra extension) on a plain Ubuntu, started, and
  # "lindvb --self-check" run in it (GTK, GStreamer elements, H.264 playback, HTTPS HLS, HbbTV).
  # Only a bundle that passes goes into the release.
  test:
    needs: flatpak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: flatpak

      - uses: actions/download-artifact@v4
        with:
          name: lindvb-flatpak

      - name: Install Flatpak, the GNOME runtime and the bundle
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak xvfb xauth dbus
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          version="$(sed -n "s/^runtime-version: '\(.*\)'/\1/p" flatpak/io.github.thommy87.LinDVB.yml)"
          # installs the runtime's related extensions (codecs-extra) as for users
          flatpak install --user -y --noninteractive flathub "org.gnome.Platform//$version"
          flatpak install --user -y --noninteractive --bundle LinDVB.flatpak
          flatpak list --user

      - name: Self-check (GTK, GStreamer elements, H.264 playback, HTTPS HLS, HbbTV)
        run: dbus-run-session -- xvfb-run -a flatpak run io.github.thommy87.LinDVB --self-check

      - name: Upload to the draft release
        if: inputs.release_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ inputs.release_id }}
          TAG: ${{ inputs.release_tag }}
        run: |
          f=LinDVB.flatpak
          name="LinDVB-${TAG}-x86_64.flatpak"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" --data-binary "@$f" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=$name" >/dev/null
          echo "Uploaded $f as $name"

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=$(find dist -name '*.flatpak' | head -1)
          cp "$f" "LinDVB-${GITHUB_REF_NAME}-x86_64.flatpak"
          gh release upload "$GITHUB_REF_NAME" "LinDVB-${GITHUB_REF_NAME}-x86_64.flatpak" --clobber --repo "$GITHUB_REPOSITORY" \
            || gh release create "$GITHUB_REF_NAME" "LinDVB-${GITHUB_REF_NAME}-x86_64.flatpak" --generate-notes --repo "$GITHUB_REPOSITORY"
