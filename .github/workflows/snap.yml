name: Snap Store

# Canonical builds the snap: snapcraft.io is connected to this repository, so
# every push to main is built on Canonical's build farm for the architectures
# under "platforms" in snap/snapcraft.yaml and released to the "edge" channel
# (see the Builds tab of https://snapcraft.io/lindvb).
#
# This workflow moves a released version from "edge" to "stable", so that
# "snap install lindvb" gives it to everyone. The Release workflow calls it
# once the release is published; it can also be run by hand for any tag whose
# build is in the store. Nothing is built here, so a slow store cannot hold
# back a release (see docs/STORES.md).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Released tag to put into the stable channel, e.g. v0.16.0"
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS:
        required: false

permissions:
  contents: read

jobs:
  stable:
    runs-on: ubuntu-24.04
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
      SNAP_NAME: lindvb
      TAG: ${{ inputs.tag || inputs.release_tag }}
      # Canonical's builds start on the push to main and take a while; the
      # release is tagged from that same commit.
      WAIT_MINUTES: "60"
    steps:
      - name: No store login
        if: env.SNAPCRAFT_STORE_CREDENTIALS == ''
        run: |
          echo "::notice title=Snap Store::SNAPCRAFT_STORE_CREDENTIALS is not set, so ${TAG} was not released to the stable channel (see docs/STORES.md)."

      - uses: actions/checkout@v4
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        with:
          ref: ${{ env.TAG }}

      - name: What to release
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        id: what
        run: |
          set -euo pipefail
          # The snap takes its version from pyproject.toml (craftctl set version)
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          if [ "$version" != "${TAG#v}" ]; then
            echo "::error title=Snap Store::Tag $TAG carries version $version; refusing to guess which to release."
            exit 1
          fi
          # the architectures Canonical builds, from snap/snapcraft.yaml
          arches="$(sed -n '/^platforms:/,/^[^[:space:]#]/ s/^[[:space:]]\{1,\}\([A-Za-z0-9_-]\{1,\}\):.*/\1/p' snap/snapcraft.yaml | tr '\n' ' ')"
          if [ -z "${arches// /}" ]; then
            echo "::error title=Snap Store::No platforms found in snap/snapcraft.yaml."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "arches=$arches" >> "$GITHUB_OUTPUT"
          echo "Releasing $SNAP_NAME $version for: $arches"

      - name: Install snapcraft
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        run: sudo snap install snapcraft --classic

      - name: Release to the stable channel
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        env:
          VERSION: ${{ steps.what.outputs.version }}
          ARCHES: ${{ steps.what.outputs.arches }}
        run: |
          # "bash -e" would end the step on the first failed store call, before
          # its output is printed, so errexit is off until the release calls.
          set +e
          set -uo pipefail
          # snapcraft 9 dropped the old "list-revisions" alias for "revisions".
          revcmd=revisions
          snapcraft revisions --help >/dev/null 2>&1 || revcmd=list-revisions
          # Wait until Canonical's build of this version is in the store, then
          # release that revision (one per architecture) to stable.
          deadline=$((SECONDS + WAIT_MINUTES * 60))
          while :; do
            out="$(snapcraft "$revcmd" "$SNAP_NAME" 2>&1)"; rc=$?
            if [ "$rc" -ne 0 ]; then
              printf '%s\n' "$out"
              echo "::error title=Snap Store::snapcraft $revcmd $SNAP_NAME failed with exit code $rc."
              exit 1
            fi
            if [ -z "${shown:-}" ]; then printf '%s\n' "$out"; shown=1; fi
            revisions=""; missing=""
            for arch in $ARCHES; do
              # Rev. | Uploaded | Arch | Version | Channels
              # several pushes can carry the same version; take the newest revision
              rev="$(printf '%s\n' "$out" | awk -v a="$arch" -v v="$VERSION" '$3 == a && $4 == v { print $1 }' | sort -n | tail -1)"
              if [ -n "$rev" ]; then revisions="$revisions $arch:$rev"; else missing="$missing $arch"; fi
            done
            [ -z "$missing" ] && break
            if [ "$SECONDS" -ge "$deadline" ]; then
              printf '%s\n' "$out"
              echo "::error title=Snap Store::No $VERSION build in the store for:$missing. Check the Builds tab of https://snapcraft.io/$SNAP_NAME."
              exit 1
            fi
            echo "waiting for $VERSION ($missing) ..."
            sleep 60
          done
          set -e
          for pair in $revisions; do
            echo "== revision ${pair##*:} (${pair%%:*})"
            snapcraft release "$SNAP_NAME" "${pair##*:}" stable
          done
          snapcraft status "$SNAP_NAME" || true
