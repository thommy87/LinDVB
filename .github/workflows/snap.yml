name: Build Snap

# Only built for releases (the Release workflow, or a pushed v* tag) and on
# demand; normal pushes and pull requests build only the AppImage.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_id:
        description: "Draft release to upload the package to (set by the Release workflow)"
        type: string
        default: ""
      release_tag:
        type: string
        default: ""

permissions:
  contents: write

jobs:
  snap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: snapcore/action-build@v1
        id: build

      - name: Check the snap
        run: |
          unsquashfs -l "${{ steps.build.outputs.snap }}" | grep -E 'lib/lindvb/lindvb/app.py|bin/dvbv5-scan|libgstdvb.so|libgstteletext.so'

      - name: Upload to the draft release
        if: inputs.release_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ inputs.release_id }}
          TAG: ${{ inputs.release_tag }}
        run: |
          f="$(ls ${{ steps.build.outputs.snap }} | head -1)"
          name="lindvb_${TAG#v}_amd64.snap"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" --data-binary "@$f" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=$name" >/dev/null
          echo "Uploaded $f as $name"

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.build.outputs.snap }}" --clobber
