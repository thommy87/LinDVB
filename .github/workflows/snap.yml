name: Snap Store

# Canonical builds the snap: snapcraft.io is connected to this repository, so
# every push to main is built on Canonical's build farm for the architectures
# under "platforms" in snap/snapcraft.yaml and released to the "edge" channel
# (see the Builds tab of https://snapcraft.io/lindvb).
#
# This workflow tests exactly that build and only then moves it on:
#   1. test: on an amd64 and an arm64 runner, wait until "edge" carries the
#      released version, install it from the store as a user would and run
#      "lindvb --self-check" (GTK, GStreamer elements, H.264 playback).
#   2. release: move the tested revisions into a channel. The Release workflow
#      asks for "candidate". "stable" (what "snap install lindvb" gives
#      everyone) is only ever set by hand, after a person has tried the
#      candidate: Actions -> Snap Store -> Run workflow, channel "stable".
# Nothing is built here, so a slow store cannot hold back a release (see
# docs/STORES.md).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Released tag whose snap to test and release, e.g. v0.16.0"
        required: true
        type: string
      channel:
        description: "Channel for the tested revisions"
        required: true
        default: candidate
        type: choice
        options: [candidate, stable]
      build_test:
        description: "Instead: build this branch's snap with snapcraft and only test it"
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
      channel:
        type: string
        default: candidate
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS:
        required: false

permissions:
  contents: read

env:
  SNAP_NAME: lindvb
  TAG: ${{ inputs.tag || inputs.release_tag }}
  # Canonical's builds start on the push to main and take a while; the
  # release is tagged from that same commit.
  WAIT_MINUTES: "75"

jobs:
  build-test:
    if: inputs.build_test == true
    uses: ./.github/workflows/snap-test.yml

  test:
    if: inputs.build_test != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Wait for the ${{ matrix.arch }} build in edge
        id: wait
        run: |
          set -uo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          if [ "$version" != "${TAG#v}" ]; then
            echo "::error title=Snap::Tag $TAG carries version $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          deadline=$((SECONDS + WAIT_MINUTES * 60))
          while :; do
            # "  latest/edge:      0.19.2 2026-11-19 (72) 160MB -"
            edge="$(snap info "$SNAP_NAME" 2>/dev/null | awk '$1 == "latest/edge:" { print $2 }')"
            [ "$edge" = "$version" ] && break
            if [ "$SECONDS" -ge "$deadline" ]; then
              snap info "$SNAP_NAME" || true
              echo "::error title=Snap::edge still has ${edge:-nothing} for ${{ matrix.arch }}, not $version. Check https://snapcraft.io/$SNAP_NAME/builds."
              exit 1
            fi
            echo "edge has ${edge:-nothing}, waiting for $version ..."
            sleep 60
          done

      - name: Install it from the store
        env:
          VERSION: ${{ steps.wait.outputs.version }}
        run: |
          sudo snap install "$SNAP_NAME" --channel=edge
          snap list "$SNAP_NAME" gnome-46-2404
          installed="$(snap list "$SNAP_NAME" | awk -v n="$SNAP_NAME" '$1 == n { print $2 }')"
          if [ "$installed" != "$VERSION" ]; then
            echo "::error title=Snap::edge moved on to $installed while testing $VERSION."
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth

      - name: Self-check (GTK, GStreamer elements, H.264 playback)
        run: xvfb-run -a "$SNAP_NAME" --self-check

  release:
    needs: test
    runs-on: ubuntu-24.04
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
      CHANNEL: ${{ inputs.channel || 'candidate' }}
    steps:
      - name: No store login
        if: env.SNAPCRAFT_STORE_CREDENTIALS == ''
        run: |
          echo "::notice title=Snap Store::SNAPCRAFT_STORE_CREDENTIALS is not set, so the tested ${TAG} was not released to ${CHANNEL} (see docs/STORES.md)."

      - uses: actions/checkout@v4
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        with:
          ref: ${{ env.TAG }}

      - name: What to release
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        id: what
        run: |
          set -euo pipefail
          # The snap takes its version from pyproject.toml (craftctl set version)
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          if [ "$version" != "${TAG#v}" ]; then
            echo "::error title=Snap Store::Tag $TAG carries version $version; refusing to guess which to release."
            exit 1
          fi
          # the architectures Canonical builds, from snap/snapcraft.yaml
          arches="$(sed -n '/^platforms:/,/^[^[:space:]#]/ s/^[[:space:]]\{1,\}\([A-Za-z0-9_-]\{1,\}\):.*/\1/p' snap/snapcraft.yaml | tr '\n' ' ')"
          if [ -z "${arches// /}" ]; then
            echo "::error title=Snap Store::No platforms found in snap/snapcraft.yaml."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "arches=$arches" >> "$GITHUB_OUTPUT"
          echo "Releasing $SNAP_NAME $version for: $arches"

      - name: Install snapcraft
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        run: sudo snap install snapcraft --classic

      - name: Release the tested revisions
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        env:
          VERSION: ${{ steps.what.outputs.version }}
          ARCHES: ${{ steps.what.outputs.arches }}
        run: |
          # "bash -e" would end the step on the first failed store call, before
          # its output is printed, so errexit is off until the release calls.
          set +e
          set -uo pipefail
          # snapcraft 9 dropped the old "list-revisions" alias for "revisions".
          revcmd=revisions
          snapcraft revisions --help >/dev/null 2>&1 || revcmd=list-revisions
          # Wait until Canonical's build of this version is in the store, then
          # release that revision (one per architecture) to $CHANNEL.
          deadline=$((SECONDS + WAIT_MINUTES * 60))
          while :; do
            out="$(snapcraft "$revcmd" "$SNAP_NAME" 2>&1)"; rc=$?
            if [ "$rc" -ne 0 ]; then
              printf '%s\n' "$out"
              echo "::error title=Snap Store::snapcraft $revcmd $SNAP_NAME failed with exit code $rc."
              exit 1
            fi
            if [ -z "${shown:-}" ]; then printf '%s\n' "$out"; shown=1; fi
            revisions=""; missing=""
            for arch in $ARCHES; do
              # Rev. | Uploaded | Arch | Version | Channels
              # several pushes can carry the same version; take the newest revision
              rev="$(printf '%s\n' "$out" | awk -v a="$arch" -v v="$VERSION" '$3 == a && $4 == v { print $1 }' | sort -n | tail -1)"
              if [ -n "$rev" ]; then revisions="$revisions $arch:$rev"; else missing="$missing $arch"; fi
            done
            [ -z "$missing" ] && break
            if [ "$SECONDS" -ge "$deadline" ]; then
              printf '%s\n' "$out"
              echo "::error title=Snap Store::No $VERSION build in the store for:$missing. Check the Builds tab of https://snapcraft.io/$SNAP_NAME."
              exit 1
            fi
            echo "waiting for $VERSION ($missing) ..."
            sleep 60
          done
          failed=""
          for pair in $revisions; do
            echo "== revision ${pair##*:} (${pair%%:*}) -> $CHANNEL"
            if ! snapcraft release "$SNAP_NAME" "${pair##*:}" "$CHANNEL"; then
              failed="$failed ${pair%%:*}"
              echo "::error title=Snap Store::Revision ${pair##*:} (${pair%%:*}) was not released to $CHANNEL."
            fi
          done
          snapcraft status "$SNAP_NAME" || true
          [ -z "$failed" ]
