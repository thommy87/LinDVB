name: Build AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_id:
        description: "Draft release to upload the package to (set by the Release workflow)"
        type: string
        default: ""
      release_tag:
        type: string
        default: ""

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo python3-pytest gir1.2-gtk-4.0 gir1.2-gstreamer-1.0 \
            gir1.2-gst-plugins-base-1.0 gir1.2-gst-plugins-bad-1.0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-pulseaudio \
            gstreamer1.0-alsa gstreamer1.0-pipewire dvb-tools dtv-scan-tables \
            adwaita-icon-theme libgdk-pixbuf2.0-bin librsvg2-common file desktop-file-utils \
            cmake ninja-build g++ libgl-dev libegl-dev libglm-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gir1.2-webkit-6.0 xvfb xauth

      # libprojectM + gst-projectm + presets take a few minutes to build: keep them
      - name: Cache projectM
        uses: actions/cache@v4
        with:
          path: build/projectm
          key: projectm-${{ runner.os }}-${{ hashFiles('packaging/build-projectm.sh') }}

      - name: Run tests
        # Under a virtual display, so the HbbTV browser tests run in WebKitGTK.
        # Ubuntu 24.04 restricts unprivileged user namespaces, which WebKit's
        # bubblewrap sandbox needs; allow them so the tests run sandboxed.
        run: |
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns || true
          bwrap --ro-bind / / --unshare-user true && echo "bwrap ok" || echo "bwrap refused"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          xvfb-run -a python3 -m pytest -q -p no:cacheprovider tests

      - name: Build AppImage
        shell: bash
        run: |
          set +e
          packaging/build-appimage.sh 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # Surface the end of the log as an annotation so it shows on the PR.
            msg="$(tail -n 25 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=AppImage build failed::$msg"
          fi
          exit "$rc"

      - name: Smoke test
        run: |
          APPIMAGE=$(ls build/*.AppImage)
          "$APPIMAGE" --appimage-extract >/dev/null
          squashfs-root/AppRun --help
          # HbbTV: the AppImage's own WebKitGTK starts its sandboxed web process
          sed 's|-m lindvb "\$@"|"\$@"|' squashfs-root/AppRun > squashfs-root/AppRunPython
          chmod +x squashfs-root/AppRunPython
          xvfb-run -a squashfs-root/AppRunPython "$PWD/tools/appimage-webkit-check.py"

      # CI artifacts only for pushes, kept briefly: the Actions storage quota is small.
      # Release builds upload straight to the release instead.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        # a full artifact store must not turn the push build red
        continue-on-error: true
        with:
          name: LinDVB-AppImage
          path: build/*.AppImage
          retention-days: 3

      - name: Upload to the draft release
        if: inputs.release_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ inputs.release_id }}
          TAG: ${{ inputs.release_tag }}
        run: |
          f="$(ls build/*.AppImage | head -1)"
          name="LinDVB-${TAG}-x86_64.AppImage"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" --data-binary "@$f" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=$name" >/dev/null
          echo "Uploaded $f as $name"

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.AppImage --generate-notes || gh release upload "$GITHUB_REF_NAME" build/*.AppImage --clobber
