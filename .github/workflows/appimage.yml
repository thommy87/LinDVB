name: Build AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_id:
        description: "Draft release to upload the package to (set by the Release workflow)"
        type: string
        default: ""
      release_tag:
        type: string
        default: ""

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Downloaded .deb files are cached (the Ubuntu mirror is sometimes very
      # slow); the package index is refreshed on every run and only the
      # archive's current versions are installed, see the action.
      - name: Install build dependencies
        uses: ./.github/actions/apt-install
        with:
          name: appimage
          packages: >-
            python3-gi python3-gi-cairo python3-pytest gir1.2-gtk-4.0 gir1.2-gstreamer-1.0
            gir1.2-gst-plugins-base-1.0 gir1.2-gst-plugins-bad-1.0
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
            gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-pulseaudio
            gstreamer1.0-alsa gstreamer1.0-pipewire dvb-tools dtv-scan-tables
            adwaita-icon-theme libgdk-pixbuf2.0-bin librsvg2-common file desktop-file-utils
            gir1.2-webkit-6.0 xvfb xauth

      - name: Run tests
        # Under a virtual display, so the HbbTV browser tests run in WebKitGTK.
        # Ubuntu 24.04 restricts unprivileged user namespaces, which WebKit's
        # bubblewrap sandbox needs; allow them so the tests run sandboxed.
        run: |
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns || true
          bwrap --ro-bind / / --unshare-user true && echo "bwrap ok" || echo "bwrap refused"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          xvfb-run -a python3 -m pytest -q -p no:cacheprovider tests

      - name: Build AppImage
        shell: bash
        run: |
          set +e
          packaging/build-appimage.sh 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # Surface the end of the log as an annotation so it shows on the PR.
            msg="$(tail -n 25 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=AppImage build failed::$msg"
          fi
          exit "$rc"

      - name: Smoke test
        run: |
          APPIMAGE=$(ls build/*.AppImage)
          "$APPIMAGE" --appimage-extract >/dev/null
          squashfs-root/AppRun --help
          # HbbTV: the AppImage's own WebKitGTK starts its sandboxed web process
          sed 's|-m lindvb "\$@"|"\$@"|' squashfs-root/AppRun > squashfs-root/AppRunPython
          chmod +x squashfs-root/AppRunPython
          xvfb-run -a squashfs-root/AppRunPython "$PWD/tools/appimage-webkit-check.py"

      - name: Self-check (GTK, GStreamer elements, H.264 playback, audible sound, proxy, HTTPS HLS, IPTV path, HbbTV)
        # the AppImage as users start it: GTK lays out text, the elements live TV
        # needs are there and a short H.264/MPEG audio stream really decodes
        run: xvfb-run -a squashfs-root/AppRun --self-check

      - name: Self-check on Ubuntu 22.04 (older glibc)
        # The AppImage brings its own glibc for systems older than the build
        # system (AppImageHub tests on the oldest supported Ubuntu LTS): the same
        # self-check there, with only the libraries a desktop has installed.
        # The container uses the runner's (Azure) Ubuntu mirror: archive.ubuntu.com
        # is sometimes very slow. Time limits, so a hang shows its log.
        timeout-minutes: 15
        run: |
          docker run --rm --privileged -v "$PWD/squashfs-root:/lindvb:ro" ubuntu:22.04 bash -euc '
            export DEBIAN_FRONTEND=noninteractive
            sed -i "s#http://\(archive\|security\).ubuntu.com#http://azure.archive.ubuntu.com#" /etc/apt/sources.list
            echo "== apt"
            timeout 420 apt-get -o Acquire::Retries=3 update -qq
            timeout 420 apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends xvfb xauth libgl1-mesa-dri libegl1 libgles2 \
              libopengl0 libgbm1 libvulkan1 libfontconfig1 libwayland-client0 libwayland-egl1 \
              libwayland-cursor0 libx11-xcb1 libasound2 libpulse0 libpipewire-0.3-0 libva2 libva-drm2 \
              libva-x11-2 libva-wayland2 ca-certificates bubblewrap xdg-dbus-proxy dbus-x11 >/dev/null
            ldd --version | head -n1
            echo "== --help"
            timeout 60 /lindvb/AppRun --help >/dev/null
            echo "== self-check"
            timeout 300 xvfb-run -a /lindvb/AppRun --self-check'

      # CI artifacts only for pushes, kept briefly: the Actions storage quota is small.
      # Release builds upload straight to the release instead.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        # a full artifact store must not turn the push build red
        continue-on-error: true
        with:
          name: LinDVB-AppImage
          path: build/*.AppImage
          retention-days: 3

      - name: Upload to the draft release
        if: inputs.release_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ inputs.release_id }}
          TAG: ${{ inputs.release_tag }}
        run: |
          f="$(ls build/*.AppImage | head -1)"
          name="LinDVB-${TAG}-x86_64.AppImage"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" --data-binary "@$f" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=$name" >/dev/null
          echo "Uploaded $f as $name"

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.AppImage --generate-notes || gh release upload "$GITHUB_REF_NAME" build/*.AppImage --clobber
