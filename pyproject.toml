[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lindvb"
version = "0.8.0"
description = "DVB and internet TV viewer and recorder for GNOME (GTK 4, GStreamer, Linux DVB API)"
readme = "README.md"
license = {text = "GPL-2.0-or-later"}
requires-python = ">=3.10"

[project.scripts]
lindvb = "lindvb.app:main"

[tool.setuptools]
packages = ["lindvb", "lindvb.ui", "lindvb.addons"]

[tool.setuptools.package-data]
lindvb = ["icons/hicolor/scalable/actions/*.svg", "icons/hicolor/scalable/apps/*.svg", "scantables/*", "hbbtv.js", "vendor/*", "po/*.po", "po/*.pot"]

[tool.setuptools.data-files]
"share/applications" = ["data/io.github.thommy87.LinDVB.desktop"]
"share/icons/hicolor/scalable/apps" = ["data/lindvb.svg"]
"share/icons/hicolor/16x16/apps" = ["data/icons/hicolor/16x16/apps/lindvb.png"]
"share/icons/hicolor/22x22/apps" = ["data/icons/hicolor/22x22/apps/lindvb.png"]
"share/icons/hicolor/24x24/apps" = ["data/icons/hicolor/24x24/apps/lindvb.png"]
"share/icons/hicolor/32x32/apps" = ["data/icons/hicolor/32x32/apps/lindvb.png"]
"share/icons/hicolor/48x48/apps" = ["data/icons/hicolor/48x48/apps/lindvb.png"]
"share/icons/hicolor/64x64/apps" = ["data/icons/hicolor/64x64/apps/lindvb.png"]
"share/icons/hicolor/128x128/apps" = ["data/icons/hicolor/128x128/apps/lindvb.png"]
"share/icons/hicolor/256x256/apps" = ["data/icons/hicolor/256x256/apps/lindvb.png"]
"share/icons/hicolor/512x512/apps" = ["data/icons/hicolor/512x512/apps/lindvb.png"]
"share/metainfo" = ["data/io.github.thommy87.LinDVB.metainfo.xml"]
